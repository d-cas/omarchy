# Apple SPI Keyboard Support
# For MacBooks with SPI-based keyboards

# SPI keyboard driver
add_drivers+=" applespi "

# SPI platform drivers (model-dependent)
# MacBook8,1 uses these:
add_drivers+=" spi_pxa2xx_platform spi_pxa2xx_pci "

# Other MacBook models may need:
# add_drivers+=" intel_lpss_pci spi_pxa2xx_platform "
