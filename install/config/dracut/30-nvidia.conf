# NVIDIA Early KMS Support
# Loads NVIDIA drivers early for smooth boot

# NVIDIA driver modules (force early loading)
force_drivers+=" nvidia nvidia_modeset nvidia_uvm nvidia_drm "

# Include NVIDIA modprobe config
install_items+=" /etc/modprobe.d/nvidia.conf "

# Ensure DRM KMS is enabled
kernel_cmdline+=" nvidia-drm.modeset=1 "
