# Omarchy Base Dracut Configuration
# Replaces mkinitcpio HOOKS line with dracut modules

# Core modules (equivalent to base, udev, keyboard, autodetect, modconf)
add_dracutmodules+=" systemd systemd-initrd base kernel-modules "

# Plymouth (boot splash)
add_dracutmodules+=" plymouth "

# Block devices and encryption (encrypt only - FIDO2 added later)
add_dracutmodules+=" crypt systemd-cryptsetup "

# Filesystem support
add_dracutmodules+=" fs-lib btrfs "

# Console and keymap (consolefont, keymap)
add_dracutmodules+=" i18n "

# Use hostonly mode (like autodetect hook)
hostonly="yes"
hostonly_cmdline="no"

# Compression
compress="zstd"

# Early microcode (handled by dracut automatically if intel-ucode/amd-ucode installed)
early_microcode="yes"

# Show what's being done
stdlog=4

# Include systemd units for LUKS unlock
install_items+=" /usr/lib/systemd/system/systemd-cryptsetup@.service "

# Omarchy-specific: Ensure Plymouth theme is included
install_optional_items+=" /usr/share/plymouth/themes/ "
