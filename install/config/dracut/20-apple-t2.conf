# Apple T2 Hardware Support
# Ensures keyboard/touchpad work at boot on T2 Macs

# T2 drivers
add_drivers+=" apple-bce "

# USB and HID support (required for T2 keyboard/touchpad)
add_drivers+=" usbhid hid_apple hid_generic "

# USB controller drivers
add_drivers+=" xhci_pci xhci_hcd "

# Include brcmfmac config if it exists (WiFi)
install_items+=" /etc/modprobe.d/brcmfmac.conf "
